
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Tools</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>PDF Tools</h1>
        <p>Your all-in-one document utility platform</p>
    </div>

    <!-- Main page -->
    <div class="page">

        <div class="tool-container">

            <!-- Converter Card -->
            <a href="/converter" class="tool-card">
                <div class="tool-icon">🔄</div>
                <h2>Converter</h2>
                <p>Convert your PowerPoint presentations into PDF format.</p>
                <span>Explore Converter →</span>
            </a>

            <!-- Compressor Card -->
            <a href="/compressor" class="tool-card">
                <div class="tool-icon">📦</div>
                <h2>Compressor</h2>
                <p>Reduce the file size of your PDF documents.</p>
                <span>Explore Compressor →</span>
            </a>

        </div>

    </div>

    <!-- Footer -->
    <footer>
        <div class="app-footer">
            <p>Built out of curiosity by
                <a href="https://instagram.com/_avirup_._" target="_blank">
                    Avirup
                </a>
            </p>
        </div>
    </footer>

</body>
</html>
